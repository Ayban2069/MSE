<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Hash Generator — Steff Store</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        max-width: 480px;
        margin: 60px auto;
        padding: 0 20px;
        color: #3a2e22;
    }
    h1 { font-size: 20px; }
    p.hint { color: #8a7b6a; font-size: 13.5px; }
    input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ecdfcd;
        border-radius: 8px;
        font-size: 14px;
        margin: 8px 0 14px;
        box-sizing: border-box;
    }
    button {
        padding: 10px 18px;
        background: #e07a1f;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }
    button:hover { background: #c4640f; }
    textarea {
        width: 100%;
        margin-top: 16px;
        padding: 10px 12px;
        border: 1px solid #ecdfcd;
        border-radius: 8px;
        font-family: monospace;
        font-size: 13px;
        box-sizing: border-box;
        height: 70px;
    }
</style>
</head>
<body>

<h1>🔑 Password Hash Generator</h1>
<p class="hint">
    Type a plain password, get its bcrypt hash. Paste the hash — not the
    plain password — into the <code>password_hash</code> column of your
    <code>users</code> table in Supabase. This page never sends anything
    over the network; the hash is generated entirely in your browser.
</p>

<label for="plain-password">Password</label>
<input type="text" id="plain-password" placeholder="Type a password...">

<button id="generate-btn">Generate Hash</button>

<textarea id="hash-output" readonly placeholder="Your bcrypt hash will appear here..."></textarea>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script>
    document.getElementById('generate-btn').addEventListener('click', () => {
        const password = document.getElementById('plain-password').value;
        if (!password) return;
        const salt = dcodeIO.bcrypt.genSaltSync(10);
        const hash = dcodeIO.bcrypt.hashSync(password, salt);
        document.getElementById('hash-output').value = hash;
    });
</script>

</body>
</html>
